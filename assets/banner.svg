<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="vector-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
    .vector-ring { stroke: #38bdf8; stroke-width: 1.5; stroke-opacity: 0.35; }
    .node-link { stroke: #6366f1; stroke-width: 1.2; stroke-dasharray: 3 3; opacity: 0.6; }
    
    @keyframes laser-scan {
      0% { transform: translateX(0px); opacity: 0.15; }
      50% { opacity: 0.85; }
      100% { transform: translateX(1100px); opacity: 0.15; }
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes rank-wave {
      0% { stroke-dashoffset: 1000; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1000; }
    }

    @keyframes status-blink {
      0%, 100% { fill: #10b981; filter: drop-shadow(0 0 8px #10b981); }
      50% { fill: #34d399; filter: drop-shadow(0 0 14px #34d399); }
    }

    .scanner { animation: laser-scan 4.5s ease-in-out infinite alternate; }
    .pulse-node { transform-origin: center; animation: pulse-glow 3s ease-in-out infinite; }
    .rank-line { stroke-dasharray: 1000; animation: rank-wave 14s linear infinite; }
    .status-led { animation: status-blink 2s ease-in-out infinite; }
  </style>

  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <g opacity="0.35">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" class="grid-line" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" class="grid-line" />
  </g>

  <g transform="translate(940, 200)">
    <circle r="145" fill="url(#vector-grad)" stroke="#4f46e5" stroke-width="2" stroke-opacity="0.4" />
    <circle r="110" fill="none" class="vector-ring" stroke-dasharray="6 6" />
    <circle r="75" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" />
    <circle r="40" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    
    <line x1="-50" y1="-40" x2="45" y2="-20" class="node-link" />
    <line x1="45" y1="-20" x2="60" y2="50" class="node-link" />
    <line x1="60" y1="50" x2="-35" y2="45" class="node-link" />
    <line x1="-35" y1="45" x2="-50" y2="-40" class="node-link" />
    <line x1="0" y1="0" x2="-50" y2="-40" class="node-link" />
    <line x1="0" y1="0" x2="45" y2="-20" class="node-link" />
    <line x1="0" y1="0" x2="60" y2="50" class="node-link" />
    <line x1="0" y1="0" x2="-35" y2="45" class="node-link" />

    <circle cx="-50" cy="-40" r="5" fill="#38bdf8" class="pulse-node" filter="url(#soft-glow)" />
    <circle cx="45" cy="-20" r="5" fill="#a855f7" class="pulse-node" filter="url(#soft-glow)" />
    <circle cx="60" cy="50" r="5" fill="#10b981" class="pulse-node" filter="url(#soft-glow)" />
    <circle cx="-35" cy="45" r="5" fill="#f59e0b" class="pulse-node" filter="url(#soft-glow)" />
    <circle cx="0" cy="0" r="7" fill="#ec4899" class="status-led" />

    <text x="-32" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Query Vector</text>
  </g>

  <g transform="translate(80, 260)">
    <line x1="0" y1="-55" x2="640" y2="-55" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.65" />
    <text x="648" y="-51" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">TOP RANK</text>

    <line x1="0" y1="0" x2="640" y2="0" stroke="#10b981" stroke-width="1.5" opacity="0.45" />
    <text x="648" y="4" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">RELEVANCE CUTOFF</text>

    <line x1="0" y1="55" x2="640" y2="55" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.5" />
    <text x="648" y="59" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">RECALL POOL</text>

    <path d="M 0,15 Q 60,-45 120,-15 T 240,25 T 360,-40 T 480,20 T 560,-25 L 630,-10" 
          fill="none" stroke="url(#accent-grad)" stroke-width="3.5" filter="url(#soft-glow)" class="rank-line" />
    
    <circle cx="120" cy="-15" r="4" fill="#38bdf8" />
    <circle cx="240" cy="25" r="4" fill="#38bdf8" />
    <circle cx="360" cy="-40" r="5" fill="#f59e0b" filter="url(#soft-glow)" />
    <circle cx="480" cy="20" r="4" fill="#38bdf8" />
    <circle cx="560" cy="-25" r="4" fill="#10b981" />
  </g>

  <g class="scanner">
    <line x1="60" y1="20" x2="60" y2="380" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" opacity="0.8" />
    <rect x="58" y="20" width="4" height="360" fill="#818cf8" opacity="0.3" />
  </g>

  <g transform="translate(80, 85)">
    <rect x="0" y="-30" width="310" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="15" cy="-17" r="4" fill="#10b981" class="status-led" />
    <text x="28" y="-12" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SEARCH &amp; DISCOVERY ECOSYSTEM</text>

    <text x="0" y="25" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Awesome Search &amp; Discovery</text>
    <text x="0" y="70" fill="url(#accent-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#soft-glow)">Platform Ecosystem</text>
    <text x="0" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14.5" font-weight="400">Curated Reference for Vector Retrieval, Semantic Search, Merchandising &amp; AI Recommendations</text>
  </g>
</svg>